<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yapmod plugins</title>
  <style>
    :root { color-scheme: light dark; font: 100%/1.55 system-ui, sans-serif; }
    main { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
    article { border-top: 1px solid GrayText; padding: 1.25rem 0 2rem; }
    h2 { margin: 0; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { display: block; width: 100%; box-sizing: border-box; padding: .6rem; font: .9rem monospace; }
  </style>
</head>
<body>
  <main>
    <h1>My Yapmod plugins</h1>
    <p>A collection of plugins for Yapin.</p>
    <p>Download individual plugins or add the whole collection in <strong>Plugins → Add Plugin → Collection</strong>.</p>
    <label>Yapmod collection URL<input readonly value="https://raw.githubusercontent.com/yapmod/plugin-starter/plugin-dist/index.json" onclick="this.select()"></label>
    <p><a href="./index.json" download="index.json">Download collection index</a></p>
    <article>
      <h2>starter</h2>
      <small>v1.0.0 · Yapmod</small>
      <p>Customize a greeting in a Yapmod settings section.</p>
      <a href="./starter/plugin.js" download="starter.js">Download JavaScript</a>
      <label>Yapmod import URL<input readonly value="https://raw.githubusercontent.com/yapmod/plugin-starter/plugin-dist/starter/" onclick="this.select()"></label>
    </article>
  </main>
</body>
</html>
